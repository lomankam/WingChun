name = "wingchun-sync"
main = "worker.js"
compatibility_date = "2026-07-25"

[[d1_databases]]
binding = "VISITOR_STATS"
database_name = "wingchun-visitor-stats"
database_id = "f041c071-6b50-4911-956d-548f6f3d63f9"

# Workers AI is exposed in worker.js as env.AI.
[ai]
binding = "AI"

# Check the channel uploads playlist every 15 minutes (UTC).
[triggers]
crons = ["*/15 * * * *"]

[vars]
YOUTUBE_CHANNEL_ID = "UCe1GCW5PvXRayPykPNt4R6Q"
ADMIN_SESSION_ORIGIN = "https://wingchun-sync.lomankam-master.workers.dev"

# Keep these values in Cloudflare Secrets; do not put them in this file.
# YOUTUBE_API_KEY
# GITHUB_TOKEN
# ADMIN_PASSWORD
